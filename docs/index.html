<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Wardrobe</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header><h1>👕 My Wardrobe</h1>
  <span id="headerRight">
    <span id="cartBadge" style="display:none">Cart: 0</span>
    <button id="logoutBtn" class="btn-ghost btn-sm" style="display:none" onclick="logout()">Log out</button>
  </span>
</header>

<main>
  <!-- Auth gate: shown until logged in -->
  <section id="view-auth" class="view active">
    <h2>Sign in</h2>
    <div class="msg" id="authMsg" style="display:none"></div>
    <div class="pending" style="display:block">
      <div class="fields">
        <label style="font-size:12px;color:var(--muted)">Backend URL (your deployed API)</label>
        <input type="text" id="apiBaseInput" placeholder="https://your-backend.onrender.com/api">
        <label style="font-size:12px;color:var(--muted);margin-top:6px">Username</label>
        <input type="text" id="authUser" placeholder="username">
        <label style="font-size:12px;color:var(--muted)">Password</label>
        <input type="password" id="authPass" placeholder="password">
        <div style="display:flex;gap:6px;margin-top:6px">
          <button class="btn-primary btn-sm" onclick="doAuth('login')">Log in</button>
          <button class="btn-ghost btn-sm" onclick="doAuth('signup')">Sign up</button>
        </div>
      </div>
    </div>
  </section>

  <section id="view-wardrobe" class="view">
    <div class="upload-row">
      <button class="btn-primary" style="flex:1" onclick="document.getElementById('fileInput').click()">＋ Add clothing photo</button>
      <select id="filterCat" onchange="renderWardrobe()">
        <option value="">All</option><option>Top</option><option>Bottom</option><option>Dress</option><option>Outerwear</option><option>Shoes</option><option>Accessory</option>
      </select>
    </div>
    <input type="file" id="fileInput" accept="image/*" onchange="onFileChosen(event)">
    <div id="pendingBox"></div>
    <div id="wardrobeGrid" class="grid"></div>
  </section>

  <section id="view-tryon" class="view">
    <h2>Try it on</h2>
    <div id="camMsg" class="msg" style="display:none"></div>
    <div class="camwrap" id="camwrap">
      <video id="video" autoplay playsinline muted></video>
      <img id="overlayImg" style="display:none">
    </div>
    <div style="text-align:center;margin-top:8px;display:flex;gap:8px;justify-content:center">
      <button class="btn-ghost" id="camBtn" onclick="toggleCamera()">Start camera</button>
      <button class="btn-ghost" id="autoBtn" onclick="toggleAutoFit()">Auto-fit: Off</button>
    </div>
    <div id="clothStrip" class="strip"></div>
    <div class="controls" id="overlayControls" style="display:none">
      <label>Size (drag or auto-fit sets this)</label>
      <input type="range" id="scaleR" min="40" max="400" value="150" oninput="manualAdjust()">
      <label>Rotate</label>
      <input type="range" id="rotR" min="-180" max="180" value="0" oninput="manualAdjust()">
    </div>
    <div class="row2">
      <button class="btn-ghost" onclick="resetOverlay()">Reset position</button>
      <button class="btn-primary" onclick="addToCart()">Add to cart 🛒</button>
    </div>
  </section>

  <section id="view-cart" class="view">
    <h2>Your cart</h2>
    <div id="cartList"></div>
  </section>
</main>

<nav id="mainNav" style="display:none">
  <button data-v="wardrobe" onclick="switchTab('wardrobe')"><span class="ic">👚</span>Wardrobe</button>
  <button data-v="tryon" onclick="switchTab('tryon')"><span class="ic">🤳</span>Try On</button>
  <button data-v="cart" onclick="switchTab('cart')"><span class="ic">🛒</span>Cart</button>
</nav>
<div class="toast" id="toast"></div>

<!-- Pose detection, for auto-fitting clothes to your body -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
<script src="app.js"></script>
</body>
</html>
